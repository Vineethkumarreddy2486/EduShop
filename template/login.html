{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, #5cc6c6, #000000);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
        }

        nav h1 {
            color: cyan;
            font-size: 1rem;
            font-style: italic;
        }

        nav a {
            color: cyan;
            text-decoration: none;
            font-size: 1rem;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Form Container */
        #reg {
            margin: auto;
            /* centers vertically & horizontally */
            background: rgba(50, 50, 50, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 3px 3px 8px rgb(140, 215, 230);
            width: 350px;
            max-width: 90%;
        }

        /* Heading inside form */
        #reg h1 {
            margin-top: -20px;
            margin-bottom: 25px;
            text-align: center;
            border-radius: 5px;
            font-size: 28px;
            padding: 12px;
            color: white;
        }

        /* Labels */
        #reg label {
            color: white;
            font-size: 16px;
            display: block;
        }

        /* Inputs */
        #reg input {
            width: 100%;
            height: 30px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            margin-bottom: 20px;
            font-size: 15px;
        }

        /* Button */
        #submit {
            width: 100%;
            padding: 10px;
            background: #30c0d9;
            color: black;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        #submit:hover {
            opacity: 0.6;
        }
        #reg p{
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav h1 {
                font-size: 1.2rem;
            }

            nav a {
                font-size: 0.9rem;
            }

            #reg {
                width: 80%;
                padding: 25px;
            }

            #reg h1 {
                font-size: 24px;
            }

            #submit {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            nav {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            nav h1 {
                font-size: 1rem;
            }

            nav a {
                font-size: 0.8rem;
            }

            #reg {
                width: 90%;
                padding: 20px;
            }

            #reg h1 {
                font-size: 20px;
            }

            #submit {
                font-size: 15px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="div1">
            <h1>SignUp before Sign In</h1>
        </div>
        <div class="div2">
            <a href="{% url 'getdata' %}">--Go back</a>
        </div>
    </nav>

    <div id="reg" style="border-radius: 10px;">
        <form action="" method="post">
            {% csrf_token %}
            <h1>Sign In</h1>
            <label for="">username</label><br>
            <input type="text" name="username" id="inp1" placeholder="enter your username"><br>
            <label for="">password</label><br>
            <input type="password" name="password" id="inp2" placeholder="enter your password"><br><br>
            <a href="{% url 'course'%}"><button id="submit">Sign In</button></a>
            <p>Don't have an account ? <a href="{% url 'register'%}" style="color: cyan;">SignUp</a></p>
        </form>
    </div>
</body>
