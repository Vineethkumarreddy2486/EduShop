{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, #5cc6c6, #000000);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
        }

        nav h1 {
            color: cyan;
            font-size: 1rem;
            font-style: italic;
        }

        nav a {
            color: cyan;
            text-decoration: none;
            font-size: 1rem;
        }

        nav a:hover {
            text-decoration: underline;
        }

        #reg {
            margin: auto;
            background: rgba(50, 50, 50, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 3px 3px 8px rgb(140, 215, 230);
            width: 370px;
            max-width: 90%;
        }

        #reg h1 {
            margin-top: -20px;
            margin-bottom: 25px;
            text-align: center;
            border-radius: 5px;
            font-size: 28px;
            padding: 12px;
            color: white;
        }

        .field-group {
            position: relative;
            margin-bottom: 6px;
        }

        #reg label {
            color: white;
            font-size: 15px;
            display: block;
            margin-bottom: 5px;
        }

        #reg input {
            width: 100%;
            height: 38px;
            padding: 8px 36px 8px 10px;
            border-radius: 8px;
            border: 2px solid transparent;
            outline: none;
            font-size: 15px;
            background: #b8f9fb;
            transition: border-color 0.25s, background 0.25s;
        }

        #reg input:focus {
            border-color: #30c0d9;
            background: #d6fdff;
        }

        #reg input.valid {
            border-color: #28a745;
            background: #d4edda;
        }

        #reg input.invalid {
            border-color: #dc3545;
            background: #fde8e8;
        }

        .field-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
            display: none;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            min-height: 16px;
            margin-bottom: 12px;
            display: block;
            padding-left: 2px;
        }

        #submit {
            margin-top: 10px;
            margin-bottom: 10px;
            width: 100%;
            padding: 10px;
            background: #30c0d9;
            color: black;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.3s;
            font-family: inherit;
        }

        #submit:hover {
            opacity: 0.75;
        }

        #reg p {
            color: white;
            font-size: 14px;
            margin-top: 4px;
        }

        #reg p a {
            color: cyan;
        }

        @media (max-width: 768px) {
            nav h1 { font-size: 1.2rem; }
            nav a { font-size: 0.9rem; }
            #reg { width: 80%; padding: 25px; }
            #reg h1 { font-size: 24px; }
        }

        @media (max-width: 480px) {
            nav { flex-direction: column; gap: 10px; text-align: center; }
            nav h1 { font-size: 1rem; }
            nav a { font-size: 0.8rem; }
            #reg { width: 90%; padding: 20px; }
            #reg h1 { font-size: 20px; }
        }

        .server-error{
        background: #ffe5e5;
        color: #dc3545;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        text-align: center;
        font-size: 14px;
        }
    </style>
</head>

<body>

    <nav>
        <div class="div1">
            <h1>SignUp before Sign In</h1>
        </div>
        <div class="div2">
            <a href="{% url 'getdata' %}">--Go back</a>
        </div>
    </nav>

    <div id="reg">
        <form action="" method="post" id="loginForm" novalidate>
            {% csrf_token %}
            <h1>Sign In</h1>

            <!-- Username -->
            <label for="inp1">Username</label>
            <div class="field-group">
                <input type="text" name="username" id="inp1" placeholder="enter your username" autocomplete="off">
                <span class="field-icon" id="icon-username"></span>
            </div>
            <span class="error-msg" id="err-username"></span>

            <!-- Password -->
            <label for="inp2">Password</label>
            <div class="field-group">
                <input type="password" name="password" id="inp2" placeholder="enter your password" autocomplete="current-password">
                <span class="field-icon" id="icon-password"></span>
            </div>
            <span class="error-msg" id="err-password"></span>

            <button type="submit" id="submit">Sign In</button>
                {% if error %}
                <div class="server-error">
                    {{ error }}
                </div>
                {% endif %}
            <p>Don't have an account? <a href="{% url 'register' %}">SignUp</a></p>
        </form>
    </div>

    <script src="{% static 'js/login_validation.js' %}"></script>
</body>
</html>
